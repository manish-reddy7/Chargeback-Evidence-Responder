# thresholds.yaml — Confidence thresholds + scoring knobs + cost model.
#
# R8: the thresholds that gate Submit / Submit-with-caveats / Do-not-submit are
# explicit, documented, and tunable here — this is the "bounded and gated" story
# for judges. R19: any change to these must be re-run against the full held-out
# set before it is called an improvement (no single-case tuning).
#
# Confidence (0-100) comes from the Sufficiency Scorer (see families.yaml model).

recommendation:
  # confidence >= submit_min AND no critical gaps            -> Submit
  # caveats_min <= confidence < submit_min (or gaps present) -> Submit with caveats
  # confidence < caveats_min                                 -> Do not submit
  submit_min: 72
  caveats_min: 45

scoring:
  # Weak evidence earns this fraction of its field weight.
  weak_multiplier: 0.5
  # If any `required: true` field (families.yaml) is missing, confidence is
  # capped at this value and a critical gap is recorded.
  required_missing_ceiling: 30
  # If a family defines gate.require_any and none of those fields is present/weak,
  # confidence is capped at this value.
  require_any_ceiling: 25

# ---------------------------------------------------------------------------
# False-positive cost model (rules.md R11: express cost in a concrete unit).
# A FALSE POSITIVE = the system recommends fighting (Submit or Submit-with-caveats)
# a dispute whose ground-truth label is should-lose. These numbers are illustrative
# and deliberately tunable — they are assumptions, documented so a judge can argue
# with them, not hidden inside code.
# ---------------------------------------------------------------------------
costs:
  currency: "INR"
  ops_hours_per_submission: 0.5      # analyst time to assemble + file one rebuttal
  ops_hourly_rate_inr: 600           # loaded cost of an ops analyst per hour
  representment_fee_inr: 350         # fee paid per representment attempt (win or lose)
  lost_dispute_penalty_inr: 750      # expected dispute-ratio-penalty / fine contribution
                                     # per wrongly-submitted case that then loses
  # Derived per false positive: ops_hours*rate + representment_fee + lost_penalty
  #   = 0.5*600 + 350 + 750 = 1400 INR

  # A FALSE NEGATIVE = failing to fight a winnable dispute; the merchant forgoes
  # recoverable revenue. Cost = the dispute amount. Reported separately.
  false_negative_uses_dispute_amount: true
